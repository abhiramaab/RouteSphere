name: Keep Render Service Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://routesphere-1.onrender.com"
          fi
          echo "Pinging $TARGET_URL ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL")
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Render service is warm and healthy!"
          else
            echo "Warning: Received HTTP $STATUS"
          fi
