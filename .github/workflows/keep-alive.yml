name: Keep Render Service Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set. Please set it in repository secrets."
            exit 1
          fi
          echo "Pinging $TARGET_URL ..."
          curl -s -f "$TARGET_URL" > /dev/null && echo "Backend is up and active!" || echo "Failed to ping backend"
